[project]
name = "activit-pratique-ai-agentmcp"
version = "0.1.0"
description = "SAV pédagogique : agents LangChain, orchestrateur LangGraph et RAG multimodal via MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-chroma>=1.0,<2",
    "langchain-mcp-adapters>=0.2,<0.4",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.0,<2",
    "mcp>=1.24,<2",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
